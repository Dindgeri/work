<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>João David</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0c0c;
      --bg2:       #141414;
      --bg3:       #1c1c1c;
      --border:    rgba(255,255,255,0.07);
      --border-hi: rgba(255,255,255,0.14);
      --text:      #f0ede8;
      --muted:     #888;
      --dim:       #444;
      --accent:    #e8d5b0;
      --accent-bg: rgba(232,213,176,0.08);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      gap: 32px;
    }

    /* PRELOADER */
    .preloader {
      position: fixed;
      inset: 0;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.6s ease-out;
    }
    .preloader.hidden { opacity: 0; pointer-events: none; }

    #sphere-container { width: 100px; height: 100px; }

    @keyframes drawLines {
      0%,100% { stroke-dashoffset: 150; }
      50%      { stroke-dashoffset: 0; }
    }
    .sphere-line {
      stroke: rgba(255,255,255,0.8);
      stroke-width: 1.5;
      stroke-dasharray: 150;
      stroke-dashoffset: 150;
      animation: drawLines 4s ease-in-out infinite;
      fill: rgba(255,255,255,0.3);
    }

    /* BACKGROUND */
    .background-image {
      position: fixed;
      inset: 0;
      background-image: url('img/frame.svg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.6s ease-out;
      pointer-events: none;
    }

    /* SECTIONS */
    .section { width: 100%; max-width: 1100px; }

    .section > h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--dim);
      text-align: center;
      margin-bottom: 24px;
    }

    .hidden-section { display: none !important; }

    /* #DETAILS */
    #details {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 40px 32px 32px;
    }

    #details .link-list {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      list-style: none;
      padding: 0;
      margin-bottom: 24px;
    }
    #details .link-list:last-child { margin-bottom: 0; }

    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .profile-picture {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-hi);
      box-shadow: 0 0 0px rgba(232,213,176,0);
      transition: box-shadow 0.3s;
    }
    .profile-picture:hover { box-shadow: 0 0 24px rgba(232,213,176,0.2); }

    .profile-container h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.12em;
      color: var(--text);
      text-align: center;
      line-height: 1.1;
      font-weight: 400;
    }
    .profile-container h2 span { color: var(--accent); }

    #details iframe {
      display: block;
      width: 100%;
      max-width: 480px;
      height: 270px;
      border: none;
      border-radius: 4px;
      margin: 0 auto;
    }

    #details .link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 1 175px;
      max-width: 175px;
      padding: 20px 16px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      transition: border-color 0.25s, color 0.25s, background 0.25s, transform 0.25s;
      text-align: center;
    }
    #details .link-item:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-bg);
      transform: translateY(-3px);
    }
    #details .link-item img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    #details .link-item p { margin: 0; }

    /* links inside li>a in details row */
    #details .link-item a {
      display: contents;
      text-decoration: none;
      color: inherit;
    }

    /* #PORTFOLIO */
    #portfolio .link-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1px;
      background: var(--border);
      list-style: none;
      padding: 0;
    }

    #portfolio li.link-item {
      position: relative;
      background: var(--bg);
      overflow: hidden;
      aspect-ratio: 4/3;
    }

    #portfolio li.link-item a {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      color: var(--text);
      position: relative;
    }

    #portfolio .portfolio-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.55s cubic-bezier(0.16,1,0.3,1), filter 0.4s;
      filter: grayscale(20%) brightness(0.85);
    }
    #portfolio li.link-item:hover .portfolio-image {
      transform: scale(1.07);
      filter: grayscale(0%) brightness(1);
    }

    .portfolio-caption {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 55%);
      display: flex;
      align-items: flex-end;
      padding: 14px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #portfolio li.link-item:hover .portfolio-caption { opacity: 1; }
    .portfolio-caption p {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      margin: 0;
    }

    .portfolio-arrow {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      opacity: 0;
      transform: translate(4px,-4px);
      transition: opacity 0.3s, transform 0.3s, background 0.3s, border-color 0.3s, color 0.3s;
    }
    #portfolio li.link-item:hover .portfolio-arrow {
      opacity: 1;
      transform: translate(0,0);
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    /* #CONTACT */
    #contact {
      background: rgba(128,128,128,0.1);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px 24px;
    }

    #contact .link-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      list-style: none;
      padding: 0;
    }

    #contact .link-item {
      flex: 0 1 90px;
      max-width: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 8px;
      background: rgba(255,255,255,0.25);
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: border-color 0.25s, background 0.25s, transform 0.25s;
    }
    #contact .link-item:hover {
      border-color: var(--border-hi);
      background: rgba(255,255,255,0.33);
      transform: translateY(-2px);
    }
    #contact .link-item a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    #contact .link-item img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: grayscale(50%) brightness(1.4);
      transition: filter 0.25s;
    }
    #contact .link-item:hover img { filter: none; }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      #details { padding: 24px 14px; }
      #details .link-item { flex: 1 1 42%; max-width: 46%; }
      #portfolio .link-list { grid-template-columns: repeat(2, 1fr); }
      #contact .link-item { flex: 1 1 72px; max-width: 72px; }
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      function hideSections() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('s1') === '0') document.getElementById('details').classList.add('hidden-section');
        if (params.get('s2') === '0') document.getElementById('portfolio').classList.add('hidden-section');
        if (params.get('s3') === '0') document.getElementById('contact').classList.add('hidden-section');
      }
      function hidePreloader() {
        document.querySelector('.preloader').classList.add('hidden');
      }
      const minimumDisplayTime = 1000;
      const startTime = performance.now();
      function checkElapsedTime() {
        const elapsed = performance.now() - startTime;
        if (elapsed >= minimumDisplayTime) hidePreloader();
        else setTimeout(hidePreloader, minimumDisplayTime - elapsed);
      }
      hideSections();
      window.addEventListener('load', checkElapsedTime);
    });

    window.addEventListener('scroll', function () {
      let scrollPercent = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 25;
      document.querySelector('.background-image').style.opacity = scrollPercent / 100;
    });
  </script>
